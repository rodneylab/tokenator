[package]
name = "tokenator"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/rodneylab/tokenator"
# xet-core-structures v1.6.0 (hf-hub 1.0.0 dependency) requires rust 1.91 or later
rust-version = "1.91"
description = "Count the number of tokens in an LLM prompt"

[dependencies]
ahash = "0.8.12"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
dotenvy = "0.15.7"
env_logger = "0.11.11"
hf-hub = "1.0.0"
http = "1.5.0"
inquire = "0.9.4"
log = "0.4.34"
miette = { version = "7.6.0", features = ["fancy"] }
num-format = "0.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.21"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_fs = "1.1.4"
insta = { version = "1.48.0", features = ["filters", "glob", "json", "redactions"] }
rexpect = "0.7.1"
trycmd = "1.2.1"

[[test]]
name = "integration"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
print_stdout = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
debug_assert_with_mut_call = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_in_scrutinee = "warn"
unused_peekable = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
